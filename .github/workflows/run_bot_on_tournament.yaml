name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min, offset off the hour. Tournament questions stay open for about 90 minutes.

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    timeout-minutes: 55 # a stuck run must not block the next ones for hours
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        run: |
          uv run python main.py
        env:
          # Secrets: Settings --> Secrets and variables --> Actions --> Secrets
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional: free news search for tournament participants
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          # The bot's dials (all optional, see BOT_NOTES.md). bot_settings.txt is
          # the simple place to set them. A repository variable set here wins:
          # Settings --> Secrets and variables --> Actions --> Variables
          BOT_TIER: ${{ vars.BOT_TIER }}
          BOT_MINIBENCH_TIER: ${{ vars.BOT_MINIBENCH_TIER }}
          BOT_FORECASTERS: ${{ vars.BOT_FORECASTERS }}
          BOT_MINIBENCH_FORECASTERS: ${{ vars.BOT_MINIBENCH_FORECASTERS }}
          BOT_RESEARCH: ${{ vars.BOT_RESEARCH }}
          BOT_MINIBENCH_RESEARCH: ${{ vars.BOT_MINIBENCH_RESEARCH }}
          BOT_BACKUP_MODELS: ${{ vars.BOT_BACKUP_MODELS }}
          BOT_MAX_USD_PER_RUN: ${{ vars.BOT_MAX_USD_PER_RUN }}
          BOT_MAX_QUESTIONS_PER_RUN: ${{ vars.BOT_MAX_QUESTIONS_PER_RUN }}
          BOT_PROB_FLOOR: ${{ vars.BOT_PROB_FLOOR }}
          BOT_OPTION_FLOOR: ${{ vars.BOT_OPTION_FLOOR }}
          BOT_DRY_RUN: ${{ vars.BOT_DRY_RUN }}
